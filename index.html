<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字掉落动画工具 V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e9e9e9;color:#171717}.app{display:grid;grid-template-columns:minmax(360px,1fr) 390px;min-height:100vh}.preview{display:flex;align-items:center;justify-content:center;padding:24px;min-width:0}.shell{width:min(100%,580px);aspect-ratio:9/16;background:#fff;box-shadow:0 16px 48px rgba(0,0,0,.16)}canvas{display:block;width:100%;height:100%}.panel{background:#f7f7f7;border-left:1px solid #d4d4d4;padding:20px;overflow:auto;max-height:100vh}.title{font-size:18px;font-weight:700}.desc{font-size:12px;color:#6d6d6d;margin:5px 0 16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{appearance:none;border:1px solid #bbb;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:12px}.btn.primary{background:#111;color:#fff;border-color:#111}.status{font-size:12px;line-height:1.45;margin-top:10px;min-height:18px;color:#555}.status.error{color:#b42318}.section{border-top:1px solid #ddd;margin-top:16px;padding-top:14px}.section h2{font-size:13px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:9px;transition:opacity .18s ease}.field.is-disabled{opacity:.42}.field label{font-size:11px;color:#555}.field input,.field select,.field textarea{width:100%;border:1px solid #c8c8c8;border-radius:8px;background:#fff;padding:8px;font:inherit;font-size:12px}.field input[type=color]{height:36px;padding:3px}.field input[type=range]{padding:0}.value{font-variant-numeric:tabular-nums}.hint{font-size:11px;line-height:1.55;color:#777}@media(max-width:900px){.app{grid-template-columns:1fr}.panel{max-height:none;border-left:0;border-top:1px solid #d4d4d4}.preview{min-height:65vh}}
</style>
</head>
<body>
<div class="app">
  <main class="preview"><div class="shell" id="shell"><canvas id="canvas" width="900" height="1600"></canvas></div></main>
  <aside class="panel">
    <div class="title">文字掉落动画工具 V2</div>
    <div class="desc">离线运行，参数修改后实时生效。</div>
    <div class="toolbar"><button class="btn primary" id="toggle">暂停</button><button class="btn" id="reset">重新掉落</button><button class="btn" id="png">导出 PNG</button><button class="btn" id="video">录制完整掉落 MP4</button></div>
    <div class="status" id="status"></div>

    <section class="section"><h2>画布与运动</h2><div class="grid">
      <div class="field"><label>画布比例</label><select id="ratio"><option>9:16</option><option>3:4</option><option>1:1</option><option>16:9</option></select></div>
      <div class="field"><label>每秒掉落数量 <span class="value" data-value="rate"></span></label><input class="motion-control" id="rate" type="range" min="0.2" max="8" step="0.1" value="1.8"></div>
      <div class="field"><label>下落速度 <span class="value" data-value="gravity"></span></label><input class="motion-control" id="gravity" type="range" min="200" max="2600" step="20" value="1150"></div>
      <div class="field"><label>反弹程度 <span class="value" data-value="bounce"></span></label><input class="motion-control" id="bounce" type="range" min="0" max="0.8" step="0.01" value="0.08"></div>
      <div class="field"><label>旋转速度 <span class="value" data-value="spin"></span></label><input class="motion-control" id="spin" type="range" min="0" max="5" step="0.05" value="0.45"></div>
      <div class="field"><label>水平漂移 <span class="value" data-value="drift"></span> px/s</label><input class="motion-control" id="drift" type="range" min="0" max="160" step="1" value="35"></div>
      <div class="field"><label>空气阻力 <span class="value" data-value="airDrag"></span></label><input class="motion-control" id="airDrag" type="range" min="0" max="2" step="0.02" value="0.18"></div>
      <div class="field"><label>碰撞摩擦 <span class="value" data-value="friction"></span></label><input class="motion-control" id="friction" type="range" min="0" max="0.8" step="0.02" value="0.42"></div>
      <div class="field"><label>静止等待 <span class="value" data-value="settleDelay"></span> 秒</label><input class="motion-control" id="settleDelay" type="range" min="0.15" max="1.2" step="0.05" value="0.35"></div>
      <div class="field"><label>物体总数 <span class="value" id="minItemsHint"></span></label><input id="maxItems" type="number" min="20" max="500" value="65"></div>
      <div class="field"><label>背景颜色</label><input id="bg" type="color" value="#f5eedf"></div>
    </div></section>

    <section class="section"><h2>文字框</h2><div class="grid">
      <div class="field"><label>形状</label><select id="containerShape"><option value="house">屋顶形</option><option value="arch">圆拱形</option><option value="rounded">圆角矩形</option><option value="trapezoid">梯形</option><option value="ellipse">椭圆形</option></select></div>
      <div class="field"><label>填充颜色</label><input id="containerColor" type="color" value="#5ba1ec"></div>
      <div class="field"><label>宽度 <span class="value" data-value="cw"></span></label><input id="cw" type="range" min="35" max="95" value="78"></div>
      <div class="field"><label>高度 <span class="value" data-value="ch"></span></label><input id="ch" type="range" min="25" max="80" value="52"></div>
      <div class="field"><label>距底部 <span class="value" data-value="bottom"></span></label><input id="bottom" type="range" min="2" max="35" value="7"></div>
      <div class="field" id="roundField"><label>容器圆角／拱度 <span class="value" data-value="round"></span></label><input id="round" type="range" min="0" max="100" value="55"></div>
      <div class="field" id="roofLengthField"><label>屋顶单侧边长 <span class="value" data-value="roofLength"></span>%</label><input id="roofLength" type="range" min="25" max="75" step="1" value="55"></div>
      <div class="field" id="roofAngleField"><label>屋顶角度 <span class="value" data-value="roofAngle"></span>°</label><input id="roofAngle" type="range" min="15" max="75" step="1" value="40"></div>
    </div></section>

    <section class="section"><h2>掉落图案</h2><div class="grid">
      <div class="field"><label>额外物体形状</label><select id="itemShape"><option value="mixed">文字＋随机图案</option><option value="pill">仅文字条</option><option value="circle">圆形</option><option value="square">方形</option><option value="triangle">三角形</option><option value="diamond">菱形</option><option value="pentagon">五边形</option><option value="star">五角星</option></select></div>
      <div class="field"><label>平均大小 <span class="value" data-value="size"></span></label><input id="size" type="range" min="18" max="100" value="46"></div>
      <div class="field"><label>大小随机度 <span class="value" data-value="jitter"></span></label><input id="jitter" type="range" min="0" max="80" value="35"></div>
      <div class="field"><label>文字框颜色</label><input id="pillColor" type="color" value="#FFE411"></div>
      <div class="field"><label>图案描边</label><input id="strokeColor" type="color" value="#ffffff"></div>
      <div class="field"><label>描边宽度</label><input id="strokeW" type="number" min="0" max="12" value="0"></div>
    </div><div class="field"><label>图案颜色，使用英文逗号分隔</label><input id="palette" value="#e84a5f,#7b2cbf,#00856a,#ff6fb5,#1f2937,#f47c20"></div></section>

    <section class="section"><h2>文字</h2><div class="field"><label>掉落文字，使用空格、逗号或换行分隔</label><textarea id="words" rows="4">穿越 周期 的 人 特别 企划 小宇宙</textarea></div><div class="grid">
      <div class="field"><label>字体</label><input id="fontFamily" value="Arial, PingFang SC, sans-serif"></div>
      <div class="field"><label>字号 <span class="value" data-value="fontSize"></span></label><input id="fontSize" type="range" min="12" max="64" value="28"></div>
      <div class="field"><label>字重</label><select id="fontWeight"><option>300</option><option selected>500</option><option>700</option><option>900</option></select></div>
      <div class="field"><label>文字颜色</label><input id="textColor" type="color" value="#171717"></div>
      <div class="field"><label>左右内边距 <span class="value" data-value="pad"></span></label><input id="pad" type="range" min="4" max="32" value="13"></div>
      <div class="field"><label>文字框／图案圆角 <span class="value" data-value="pillRound"></span></label><input id="pillRound" type="range" min="0" max="50" value="22"></div>
    </div></section>

    <section class="section"><div class="hint">MP4 录制需要浏览器支持 Canvas MediaRecorder 与 H.264/MP4 编码。若提示不支持，请换用新版 Safari、Chrome 或 Edge。</div></section>
  </aside>
</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),shell=document.getElementById('shell'),statusEl=document.getElementById('status');
function el(id){return document.getElementById(id)}
function val(id){return el(id).value}
function num(id){return Number(val(id))}
function setStatus(text,isError){statusEl.textContent=text||'';statusEl.className='status'+(isError?' error':'')}
window.addEventListener('error',function(e){setStatus('运行错误：'+e.message,true)})
var watched=['rate','gravity','bounce','spin','drift','airDrag','friction','settleDelay','maxItems','bg','containerShape','containerColor','cw','ch','bottom','round','roofLength','roofAngle','itemShape','size','jitter','pillColor','strokeColor','strokeW','palette','words','fontFamily','fontSize','fontWeight','textColor','pad','pillRound'];
function updateValues(){var nodes=document.querySelectorAll('[data-value]');for(var i=0;i<nodes.length;i++){var id=nodes[i].getAttribute('data-value');nodes[i].textContent=val(id)}}
for(var wi=0;wi<watched.length;wi++){(function(id){el(id).addEventListener('input',function(){updateValues();if(id==='words')syncMinimum();if(id==='containerShape')syncShapeControls();if(!state.recording&&['containerShape','cw','ch','bottom','round','roofLength','roofAngle','pillRound','words'].indexOf(id)>=0)reset()})})(watched[wi])}
el('spin').addEventListener('change',function(){if(!state.recording)reset()});
el('drift').addEventListener('change',function(){if(!state.recording)reset()});
updateValues();syncShapeControls();
var state={running:true,last:performance.now(),spawnAcc:0,items:[],spawnPlan:[],recording:false,recorder:null,recordStream:null,recordSeconds:0,fullSeconds:0,quietSeconds:0,lastStatusSecond:-1};
function pathRoundRect(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();if(r===0){ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();return}ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function pathRoundedPolygon(points,r){var count=points.length;r=Math.max(0,r);ctx.beginPath();if(r===0){ctx.moveTo(points[0].x,points[0].y);for(var p=1;p<count;p++)ctx.lineTo(points[p].x,points[p].y);ctx.closePath();return}var corners=[];for(var i=0;i<count;i++){var prev=points[(i+count-1)%count],cur=points[i],next=points[(i+1)%count],pdx=prev.x-cur.x,pdy=prev.y-cur.y,ndx=next.x-cur.x,ndy=next.y-cur.y,plen=Math.sqrt(pdx*pdx+pdy*pdy),nlen=Math.sqrt(ndx*ndx+ndy*ndy),cut=Math.min(r,plen*.46,nlen*.46);corners.push({x:cur.x,y:cur.y,ix:cur.x+pdx/plen*cut,iy:cur.y+pdy/plen*cut,ox:cur.x+ndx/nlen*cut,oy:cur.y+ndy/nlen*cut})}ctx.moveTo(corners[0].ix,corners[0].iy);for(var j=0;j<count;j++){var c=corners[j];ctx.lineTo(c.ix,c.iy);ctx.quadraticCurveTo(c.x,c.y,c.ox,c.oy)}ctx.closePath()}
function setShapeControl(id,fieldId,enabled){el(id).disabled=!enabled;el(fieldId).className='field'+(enabled?'':' is-disabled')}
function syncShapeControls(){var shape=val('containerShape');setShapeControl('roofLength','roofLengthField',shape==='house');setShapeControl('roofAngle','roofAngleField',shape==='house');setShapeControl('round','roundField',shape!=='ellipse')}
function containerGeom(){var W=canvas.width,H=canvas.height,w=W*num('cw')/100,h=H*num('ch')/100,x=(W-w)/2,y=H-H*num('bottom')/100-h;return{x:x,y:y,w:w,h:h,r:Math.min(w,h)*num('round')/200,shape:val('containerShape')}}
function roofGeom(g){var angle=num('roofAngle')*Math.PI/180,length=g.w*num('roofLength')/100,run=length*Math.cos(angle),rise=length*Math.sin(angle),scale=Math.min(1,(g.w*.5)/Math.max(1,run),(g.h*.82)/Math.max(1,rise));run*=scale;rise*=scale;return{cx:g.x+g.w/2,apexY:g.y,eaveY:g.y+rise,left:g.x+g.w/2-run,right:g.x+g.w/2+run}}
function traceContainer(g){var x=g.x,y=g.y,w=g.w,h=g.h,r=g.r;if(g.shape==='rounded'){pathRoundRect(x,y,w,h,r);return}if(g.shape==='ellipse'){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);ctx.closePath();return}if(g.shape==='trapezoid'){pathRoundedPolygon([{x:x+w*.16,y:y},{x:x+w*.84,y:y},{x:x+w,y:y+h},{x:x,y:y+h}],Math.min(r,w*.13,h*.16));return}if(g.shape==='arch'){var bottomRadius=Math.min(r,w*.12,h*.12),sideY=y+h*.42,curve=Math.max(h*.12,Math.min(h*.42,h*.12+r*.7));ctx.beginPath();if(bottomRadius===0){ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h)}else{ctx.moveTo(x+bottomRadius,y+h);ctx.lineTo(x+w-bottomRadius,y+h);ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-bottomRadius)}ctx.lineTo(x+w,sideY);ctx.bezierCurveTo(x+w,sideY-curve,x+w*.78,y,x+w/2,y);ctx.bezierCurveTo(x+w*.22,y,x,sideY-curve,x,sideY);if(bottomRadius===0)ctx.lineTo(x,y+h);else{ctx.lineTo(x,y+h-bottomRadius);ctx.quadraticCurveTo(x,y+h,x+bottomRadius,y+h)}ctx.closePath();return}var roof=roofGeom(g);pathRoundedPolygon([{x:x,y:y+h},{x:roof.left,y:roof.eaveY},{x:roof.cx,y:roof.apexY},{x:roof.right,y:roof.eaveY},{x:x+w,y:y+h}],Math.min(r,w*.13,h*.15))}
function roundedBottomInset(g,y){var radius=Math.min(g.r,g.w*.12,g.h*.12),distance=g.y+g.h-y;if(radius<=0||distance>=radius)return 0;return radius-Math.sqrt(Math.max(0,radius*radius-(radius-distance)*(radius-distance)))}
function horizontalBounds(y){var g=containerGeom(),x0=g.x,x1=g.x+g.w,t=Math.max(0,Math.min(1,(y-g.y)/g.h)),bottomInset=roundedBottomInset(g,y);if(g.shape==='rounded'){var radius=Math.min(g.r,g.w/2,g.h/2),edgeDistance=Math.min(y-g.y,g.y+g.h-y),cornerInset=edgeDistance<radius?radius-Math.sqrt(Math.max(0,radius*radius-(radius-edgeDistance)*(radius-edgeDistance))):0;return[x0+cornerInset,x1-cornerInset]}if(g.shape==='trapezoid'){var inset=(1-t)*g.w*.16;return[Math.max(x0+inset,x0+bottomInset),Math.min(x1-inset,x1-bottomInset)]}if(g.shape==='house'){var roof=roofGeom(g),left,right;if(y<roof.eaveY){var q=(y-roof.apexY)/Math.max(1,roof.eaveY-roof.apexY),half=(roof.right-roof.cx)*Math.max(0,Math.min(1,q));left=roof.cx-half;right=roof.cx+half}else{var wallQ=(y-roof.eaveY)/Math.max(1,g.y+g.h-roof.eaveY);left=roof.left+(x0-roof.left)*wallQ;right=roof.right+(x1-roof.right)*wallQ}return[Math.max(left,x0+bottomInset),Math.min(right,x1-bottomInset)]}if(g.shape==='arch'){if(t<.42){var q2=t/.42,half2=g.w*.5*Math.sqrt(Math.max(0,1-(1-q2)*(1-q2)));return[g.x+g.w*.5-half2,g.x+g.w*.5+half2]}return[x0+bottomInset,x1-bottomInset]}var cy=g.y+g.h/2,dy=(y-cy)/(g.h/2),half3=g.w/2*Math.sqrt(Math.max(0,1-dy*dy));return[g.x+g.w/2-half3,g.x+g.w/2+half3]}
function words(){return val('words').split(/[\s,，]+/).filter(Boolean)}
function colors(){return val('palette').split(',').map(function(s){return s.trim()}).filter(Boolean)}
var patternTypes=['circle','square','triangle','diamond','pentagon','star'];
function randomPattern(){return patternTypes[Math.floor(Math.random()*patternTypes.length)]}
function minItemCount(){return words().length+20}
function maxItemCount(){return Math.max(minItemCount(),Math.floor(num('maxItems')||0))}
function syncMinimum(){var minimum=minItemCount(),input=el('maxItems');input.min=minimum;input.max=Math.max(500,minimum);if(!Number(input.value)||Number(input.value)<minimum)input.value=minimum;el('minItemsHint').textContent='至少 '+minimum}
function makeSpawnPlan(){var plan=[],ws=words();for(var i=0;i<ws.length;i++)plan.push({type:'pill',text:ws[i]});for(var j=0;j<20;j++)plan.push({type:randomPattern(),text:''});for(var k=plan.length-1;k>0;k--){var p=Math.floor(Math.random()*(k+1)),tmp=plan[k];plan[k]=plan[p];plan[p]=tmp}return plan}
function spawn(){if(state.items.length>=maxItemCount())return;var planned=state.spawnPlan[state.items.length],shape=val('itemShape'),type=planned?planned.type:(shape==='mixed'?(Math.random()<.65?'pill':randomPattern()):shape),base=num('size'),j=num('jitter')/100,s=base*(1+(Math.random()*2-1)*j),w=s,h=s,text=planned&&planned.text?planned.text:'';if(type==='pill'){var ws=words();if(!text)text=ws[Math.floor(Math.random()*ws.length)]||'文字';ctx.font=val('fontWeight')+' '+num('fontSize')+'px '+val('fontFamily');w=Math.max(s,ctx.measureText(text).width+num('pad')*2);h=Math.max(s*.68,num('fontSize')+num('pad'))}var cs=colors(),drift=num('drift');state.items.push({type:type,text:text,x:canvas.width*.5+(Math.random()-.5)*canvas.width*.22,y:containerGeom().y-s,vx:(Math.random()*2-1)*drift,vy:0,a:(Math.random()-.5)*.8,va:(Math.random()-.5)*num('spin'),w:w,h:h,r:s/2,color:cs[Math.floor(Math.random()*cs.length)]||'#e84a5f',sleep:false,rest:0,supported:false})}
function clamp01(n){return Math.max(0,Math.min(1,n))}
function shapeCollisionRadius(it){if(it.type==='square'||it.type==='triangle')return it.r*1.3;return it.r*.98}

function capsuleContact(A,B){var P=capsule(A),Q=capsule(B),d1x=P.x2-P.x1,d1y=P.y2-P.y1,d2x=Q.x2-Q.x1,d2y=Q.y2-Q.y1,rx=P.x1-Q.x1,ry=P.y1-Q.y1,a=d1x*d1x+d1y*d1y,e=d2x*d2x+d2y*d2y,f=d2x*rx+d2y*ry,s=0,t=0,eps=.0001;if(a<=eps&&e<=eps){s=0;t=0}else if(a<=eps){s=0;t=clamp01(f/e)}else{var c=d1x*rx+d1y*ry;if(e<=eps){t=0;s=clamp01(-c/a)}else{var b=d1x*d2x+d1y*d2y,denom=a*e-b*b;s=denom!==0?clamp01((b*f-c*e)/denom):0;t=(b*s+f)/e;if(t<0){t=0;s=clamp01(-c/a)}else if(t>1){t=1;s=clamp01((b-c)/a)}}}var p1x=P.x1+d1x*s,p1y=P.y1+d1y*s,p2x=Q.x1+d2x*t,p2y=Q.y1+d2y*t,dx=p2x-p1x,dy=p2y-p1y,dist=Math.sqrt(dx*dx+dy*dy),minD=P.r+Q.r+1;if(dist>=minD)return null;if(dist<.001){dx=B.x-A.x;dy=B.y-A.y;dist=Math.sqrt(dx*dx+dy*dy);if(dist<.001){dx=1;dy=0;dist=1}}return{nx:dx/dist,ny:dy/dist,pen:minD-dist}}
